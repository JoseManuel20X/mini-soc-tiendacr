<!-- Fragmentos anadidos al ossec.conf del AGENTE (servidor objetivo 10.10.10.10) -->

<!-- 1) Lectura de las alertas de Suricata para enviarlas al SIEM -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/suricata/eve.json</location>
</localfile>

<!-- 2) Monitoreo de integridad (FIM) en tiempo real del sitio web -->
<syscheck>
  <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/tiendacr</directories>
</syscheck>
