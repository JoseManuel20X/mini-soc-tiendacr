# /etc/netplan/99-socnet.yaml - interfaz de la red interna aislada socnet
# IP por maquina:  objetivo = 10.10.10.10 | SIEM = 10.10.10.20 | atacante = 10.10.10.100
# (ajustar la direccion segun la maquina; sin gateway: red aislada)
network:
  version: 2
  ethernets:
    enp7s0:
      dhcp4: false
      addresses: [10.10.10.10/24]
